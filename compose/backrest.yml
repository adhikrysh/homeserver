# restic backups to b2. the data share is mounted read-only; no host port is published.
services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    restart: unless-stopped
#    ports:
#      - 9898:9898
    environment:
      - BACKREST_PORT=0.0.0.0:9898
    volumes:
      - ./data:/data         # Where Backrest stores its own internal database
      - ./config:/config     # Where the app configuration lives
      - /srv/sambashare/data:/userdata:ro  # Your server data (Read-Only for safety)
    networks:
      - backrest-network

networks:
  backrest-network:
    external: true
