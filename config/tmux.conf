# Scroll and select with the trackpad.
set -g mouse on
set -g history-limit 50000

# Pass Esc to programs immediately instead of waiting for a key combo.
set -sg escape-time 10

# Copy inside tmux lands on the Mac clipboard (OSC 52).
set -g set-clipboard on

# Let programs (e.g. Claude Code notifications) reach the outer terminal (cmux).
set -g allow-passthrough on
set -g focus-events on

# Full colour.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Number windows from 1 and close gaps when one exits.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-right "#H  %H:%M"
