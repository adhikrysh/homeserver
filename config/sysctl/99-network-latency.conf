# tcp tuning for a long, high-latency link. installed by scripts/apply-tcp-tuning.sh.
# bbr models bandwidth and rtt instead of treating loss as congestion; it pairs with fq.
# fastopen=3 enables tcp fast open as both client and server (saves a round trip).
# slow_start_after_idle=0 keeps a paused connection at speed.
# keepalive values notice a dead peer in ~1 minute instead of ~2 hours.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
