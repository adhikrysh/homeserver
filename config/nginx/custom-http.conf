# nginx proxy manager custom http-level snippet (applies to every proxy host).
# lives at data/nginx/custom/http.conf inside the proxy's data volume.
# gzip on; is already set in NPM's base nginx.conf
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype;
